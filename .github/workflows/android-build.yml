name: Android build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  build:
    if: github.repository == 'Naleeee/Volt'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_VOLT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_VOLT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_VOLT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # android/ is gitignored (CNG): regenerate it from app.json
      - name: Prebuild android project
        run: npx expo prebuild --platform android --no-install
      # Without the keystore secrets the APK is signed with the shared debug key (README → Releases)
      - name: Set up release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          echo "ORG_GRADLE_PROJECT_VOLT_UPLOAD_STORE_FILE=upload.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      # Phones are arm64; skipping the other three ABIs cuts the native compile and the APK size by ~4x
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: volt-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
