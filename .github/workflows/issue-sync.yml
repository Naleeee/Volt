name: Issue sync

on:
  pull_request:
    types: [opened]

jobs:
  link-pr:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'VT-')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add closing keyword to PR body
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          [[ "$HEAD_REF" =~ ^VT-([0-9]+) ]] || exit 0
          ISSUE="${BASH_REMATCH[1]}"
          grep -qiE "(close[sd]?|fix(e[sd])?|resolv(e[sd])?)[: ]+#$ISSUE\\b" <<<"$PR_BODY" && exit 0
          printf 'Closes #%s\n\n%s' "$ISSUE" "$PR_BODY" | gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
